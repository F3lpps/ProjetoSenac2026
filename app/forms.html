<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/forms.css">
    <script type="module" src="./style/images/scripts/forms.js"></script>
    <script src="style/images/scripts/navbar.js" defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Comic+Relief:wght@400;700&display=swap');
    </style>
    <title>blogs - Viajei</title>
</head>
<body> 
    
    <div id="container">
        <header>
            <img src="./style/images/Viajei.png" alt="Viajei.logo">
            <a class="link-cabecalho" href="./index.html">Viajei</a>
            <a class="link-cabecalho" href="./sobre.html">Sobre</a>
            <a class="link-cabecalho" href="./forms.html">Blogs!</a>
</header>
        <main>
            <section> 
        <form id="post-form">
        <div class="campos-topo">

        <div class="campo">
        <label for="autor">Nome:</label>
            <input type="text" name="autor" id="autor" placeholder="fulaninho">
        </div>

        <div class="campo">
        <label for="usermail">Email:</label>
            <input type="email" name="email" id="usermail" placeholder="fulaninho@gmail.com">
        </div>

        <div class="campo">
        <label for="titulo">Titulo:</label>
        <input type="text" name="titulo" id="titulo" placeholder="trapalhadas do fulaninho"><br>
        </div>

    </div>

    <label for="historia"></label>
         <textarea name="historia" id="historia" cols="30" rows="10"></textarea>

                 <button type="submit">Viajar</button>
            </section>
            </form>
        </main>
        <dialog id="modal">
      <button autofocus>Fechar</button>
      <div id="modal-content"></div>
    </dialog>

    </div>
        <footer> 
            <div id="historias"></div>
        </footer>
    </div>
</body>
</html>
