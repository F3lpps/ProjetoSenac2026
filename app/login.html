<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/app/style/login.css">
    <script type="module" src="./style/images/scripts/login.js"></script>
    <title>Loginpage</title>
    <h2>Bem vindo, Viajante</h2>
</head>
<body>
    <main>
        <section>
            <form id="post-form" action="/app/index.html" method="POST">

                <div class="campos-topo">

                    <div class="campo">
                        <label for="user">Usuário</label>
                        <input type="text" name="user" id="user" placeholder="Digite um username...">
                    </div>

                    <div class="campo">
                        <label for="email">Email</label>
                        <input type="email" name="mail" id="email" placeholder="Digite um email...">
                    </div>

                    <div class="campo">
                        <label for="password">Senha</label>
                        <input type="password" name="password" id="password" placeholder="Digite uma senha...">
                    </div>

                    <button type="submit">Entrar</button>

                </div>

            </form>
        </section>
    </main>
</body>
</html>
